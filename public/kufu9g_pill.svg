<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title">
  <title id="title">Fehér, bemetszett aszpirin tabletta</title>
  <defs>
    <linearGradient id="tabletFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#dfe3e6"/>
    </linearGradient>
    <linearGradient id="tabletEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dce0"/>
      <stop offset="1" stop-color="#aeb7be"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="17"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Átlátszó háttér; csak a tabletta és annak finom árnyéka látható -->
  <g transform="rotate(-18 500 300)" filter="url(#shadow)">
    <rect x="180" y="180" width="640" height="270" rx="135"
          fill="url(#tabletEdge)" stroke="#aeb7be" stroke-width="4"/>
    <rect x="180" y="158" width="640" height="270" rx="135"
          fill="url(#tabletFill)" stroke="#c7cdd2" stroke-width="4"/>
    <path d="M250 230 C330 165 640 150 750 220"
          fill="none" stroke="#ffffff" stroke-width="16"
          stroke-linecap="round" opacity="0.75"/>
    <path d="M500 184 C488 245 488 345 500 404"
          fill="none" stroke="#c2c9ce" stroke-width="13"
          stroke-linecap="round"/>
    <path d="M507 188 C497 250 497 340 507 399"
          fill="none" stroke="#ffffff" stroke-width="3.5"
          stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
